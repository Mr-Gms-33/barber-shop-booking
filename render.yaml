# Render Blueprint — Dashboard: New → Blueprint → connect GitHub repo
# Docs: docs/deploy.md

databases:
  - name: barber-booking-db
    plan: free
    databaseName: barber
    user: barber

services:
  - type: web
    name: barber-booking-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barber-booking-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: changeme
      - key: JWT_SECRET
        generateValue: true
      - key: BOOKING_CUTOFF_HOURS
        value: "2"
      - key: CORS_ORIGINS
        value: https://barber-booking-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  # Static sites: no `plan` field (not a compute web service). Still free on Render.
  - type: web
    name: barber-booking-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://barber-booking-api.onrender.com
