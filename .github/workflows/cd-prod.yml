name: CD Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy (rollback = previous SHA)
        required: true
        default: main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}
      - name: Deploy API (production hook)
        env:
          HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_API_PROD }}
          HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          HOOK="$HOOK_PROD"
          if [ -z "$HOOK" ]; then HOOK="$HOOK_DEV"; fi
          if [ -z "$HOOK" ]; then echo "No Render deploy hook configured"; exit 1; fi
          curl -fsS -X POST "$HOOK"
      - name: Deploy web (production hook)
        env:
          HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_WEB_PROD }}
          HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          HOOK="$HOOK_PROD"
          if [ -z "$HOOK" ]; then HOOK="$HOOK_DEV"; fi
          if [ -z "$HOOK" ]; then echo "No Render deploy hook configured"; exit 1; fi
          curl -fsS -X POST "$HOOK"
