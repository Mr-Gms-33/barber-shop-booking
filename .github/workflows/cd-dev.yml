name: CD Dev

on:
  push:
    branches: [main]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API to Render (dev)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Skip: set GitHub secret RENDER_DEPLOY_HOOK_API (Render service Deploy Hook)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
      - name: Deploy web to Render (dev)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Skip: set GitHub secret RENDER_DEPLOY_HOOK_WEB"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
